[environments.dev]
store = "dawn-original.myshopify.com"
path = "./src/theme"
ignore = []
output = "json"
live = false
allow-live = false

# Environment used for theme deployments
[environments.deployment]
store = "dawn-original.myshopify.com"
path = "./src/theme"
ignore = ["assets/.vite/manifest.json","config/settings_data.json", "templates/*.json", "templates/customers/*.json", "sections/*.json", "locales/*.json"]
output = "json"

[environments.sync]
store = "dawn-original.myshopify.com"
ignore = []
only = ["assets/.vite/manifest.json","config/settings_data.json", "templates/*.json", "templates/customers/*.json", "sections/*.json", "locales/*.json"]
nodelete = true
path = "./src/theme"